services:
  db:
    image: docker.io/library/postgres:16
    container_name: hrc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - hrc-pgdata:/var/lib/postgresql/data

volumes:
  hrc-pgdata: